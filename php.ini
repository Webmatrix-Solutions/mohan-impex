; Mohan Impex - Custom PHP Configuration

; File uploads
upload_max_filesize = 64M
post_max_size       = 64M
max_file_uploads    = 20

; Memory & execution
memory_limit        = 256M
max_execution_time  = 300
max_input_time      = 300
max_input_vars      = 3000

; Error handling
display_errors      = Off
log_errors          = On
error_log           = /var/log/php_errors.log

; Session
session.gc_maxlifetime = 3600

; Timezone
date.timezone = "Asia/Kolkata"