name: Deploy Mohan Impex WordPress Site to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'themes/**'
      - 'plugins/**'
  workflow_dispatch:        # ← moved to correct level, same as push

jobs:
  deploy:
    name: Deploy to Hostinger (lavenderblush)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Themes
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./themes/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/wp-content/themes/

      - name: Deploy Plugins
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./plugins/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}/wp-content/plugins/

      - name: Purge WordPress and LiteSpeed caches
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "set -e; \
            cd ${{ secrets.REMOTE_PATH }}; \
            command -v wp >/dev/null; \
            wp cache flush --allow-root; \
            if wp plugin is-active litespeed-cache --allow-root >/dev/null 2>&1; then \
              wp litespeed-purge all --allow-root; \
            fi"

      - name: Deployment Complete
        run: echo "✅ Deployed to lavenderblush-mouse-811581.hostingersite.com"
